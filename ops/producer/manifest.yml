apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: betterops
  labels:
    app: producer
    app.kubernetes.io/part-of: betterops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: sarthakyadav783/betterops-producer:7826c789a24d0315260d646b4d3f75c7392053e3
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: betterops-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: betterops-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
