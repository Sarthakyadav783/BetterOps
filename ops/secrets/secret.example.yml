# DO NOT commit real values. Create the live secret with:
# kubectl apply -f ops/secrets/secret.yml
# (keep a local secret.yml that is gitignored)
apiVersion: v1
kind: Secret
metadata:
  name: betterops-secrets
  namespace: betterops
  labels:
    app.kubernetes.io/part-of: betterops
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_WITH_NEON_DATABASE_URL"
  JWT_SECRET: "REPLACE_WITH_JWT_SECRET"
  REDIS_URL: "redis://redis.betterops.svc.cluster.local:6379"
